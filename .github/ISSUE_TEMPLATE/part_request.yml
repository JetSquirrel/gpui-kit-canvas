name: Part request
description: Ask for a gpui-kit component that the parts panel does not have yet
labels: ["part request"]
body:
  - type: input
    id: name
    attributes:
      label: Component
      description: The gpui-kit component, with its import path or a link to its doc page.
      placeholder: DatePicker — gpui_kit::component::date_picker::{DatePicker, DatePickerState}
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you would use it for
      description: The kind of window where you miss it. This helps decide which variants matter.
    validations:
      required: true
  - type: checkboxes
    id: exists
    attributes:
      label: Before you file
      options:
        - label: I checked that this component exists in gpui-kit today (source or gpui-kit.com/docs/components)
          required: true
